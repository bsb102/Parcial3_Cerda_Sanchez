spring.application.name=${APP_SERVICE_NAME:backend-skates-app}
spring.profiles.default=all

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.cognito.issuer-uri=${COGNITO_ISSUER_URI:}
app.cognito.client-ids=${COGNITO_CLIENT_IDS:${COGNITO_CLIENT_ID:}}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://localhost:5173,https://localhost:5174}
app.aws.region=${AWS_REGION:us-east-1}
app.messaging.enabled=${MESSAGING_ENABLED:false}
app.messaging.topic-arn=${SNS_TOPIC_ARN:}
app.messaging.queues.orders.url=${SQS_ORDERS_QUEUE_URL:}
app.messaging.queues.orders.dlq-url=${SQS_ORDERS_DLQ_URL:}
app.messaging.queues.inventory.url=${SQS_INVENTORY_QUEUE_URL:}
app.messaging.queues.inventory.dlq-url=${SQS_INVENTORY_DLQ_URL:}
app.messaging.queues.notifications.url=${SQS_NOTIFICATIONS_QUEUE_URL:}
app.messaging.queues.notifications.dlq-url=${SQS_NOTIFICATIONS_DLQ_URL:}
app.messaging.max-receive-count=${SQS_MAX_RECEIVE_COUNT:5}
app.messaging.poll-interval-ms=${SQS_POLL_INTERVAL_MS:1000}
app.kinesis.enabled=${KINESIS_ENABLED:false}
app.kinesis.region=${AWS_REGION:us-east-1}
app.kinesis.endpoint-override=${KINESIS_ENDPOINT_OVERRIDE:}
app.kinesis.orders.name=${KINESIS_ORDERS_STREAM_NAME:skates-orders-events}
app.kinesis.orders.shard-count=${KINESIS_ORDERS_SHARD_COUNT:3}
app.kinesis.orders.retention-hours=${KINESIS_ORDERS_RETENTION_HOURS:24}
app.kinesis.orders.capacity-mode=${KINESIS_ORDERS_CAPACITY_MODE:PROVISIONED}
app.kinesis.inventory.name=${KINESIS_INVENTORY_STREAM_NAME:skates-inventory-events}
app.kinesis.inventory.shard-count=${KINESIS_INVENTORY_SHARD_COUNT:3}
app.kinesis.inventory.retention-hours=${KINESIS_INVENTORY_RETENTION_HOURS:168}
app.kinesis.inventory.capacity-mode=${KINESIS_INVENTORY_CAPACITY_MODE:PROVISIONED}
app.kinesis.dead-letter.name=${KINESIS_DLQ_STREAM_NAME:skates-dead-letter-stream}
app.kinesis.dead-letter.shard-count=${KINESIS_DLQ_SHARD_COUNT:1}
app.kinesis.dead-letter.retention-hours=${KINESIS_DLQ_RETENTION_HOURS:168}
app.kinesis.dead-letter.capacity-mode=${KINESIS_DLQ_CAPACITY_MODE:PROVISIONED}
app.kinesis.consumers.analytics-app-name=${KINESIS_ANALYTICS_APP_NAME:skates-analytics-app}
app.kinesis.consumers.notifications-app-name=${KINESIS_NOTIFICATIONS_APP_NAME:skates-notifications-app}
app.kinesis.consumers.initial-position=${KINESIS_INITIAL_POSITION:LATEST}
app.kinesis.consumers.max-retries=${KINESIS_MAX_RETRIES:5}
app.kinesis.consumers.backoff-initial-ms=${KINESIS_BACKOFF_INITIAL_MS:500}
app.kinesis.consumers.backoff-multiplier=${KINESIS_BACKOFF_MULTIPLIER:2.0}
app.kinesis.consumers.max-backoff-ms=${KINESIS_MAX_BACKOFF_MS:10000}
app.kinesis.consumers.polling-max-records=${KINESIS_POLLING_MAX_RECORDS:100}
app.kinesis.consumers.failover-time-millis=${KINESIS_FAILOVER_TIME_MILLIS:10000}
app.kinesis.consumers.app-selector=${KINESIS_CONSUMER_APP:all}
app.kinesis.alarm.iterator-age-threshold-ms=${KINESIS_ITERATOR_AGE_THRESHOLD_MS:60000}
app.kinesis.alarm.evaluation-periods=${KINESIS_ALARM_EVALUATION_PERIODS:2}
app.kinesis.alarm.period=${KINESIS_ALARM_PERIOD:60}
transbank.environment=${TRANSBANK_ENVIRONMENT:TEST}
transbank.commerce-code=${TRANSBANK_COMMERCE_CODE:597055555532}
transbank.api-key-secret=${TRANSBANK_API_KEY_SECRET:}
transbank.create-url=${TRANSBANK_CREATE_URL:https://webpay3gint.transbank.cl/rswebpaytransaction/api/webpay/v1.2/transactions}
transbank.return-url=${TRANSBANK_RETURN_URL:https://localhost:5173/pago/resultado}
